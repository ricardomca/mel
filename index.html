<style>
/* Layout: barra lateral fixa no desktop, barra de abas inferior no celular; conteúdo em listas densas, estados por cor semântica. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#eceef3; --ink:#161a21; --muted:#5b6372; --line:#dcdfe6;
  --accent:#F2B705; --accent-ink:#1C1710; --accent-fg:#8A5A00; --accent-soft:#FBEFD0; --wing:#FFF6E0; --bee:#1C1710;
  --ok:#1d7a4c; --ok-soft:#e1f2e9; --warn:#c2410c; --warn-soft:#fde8dc; --crit:#d22f1f; --crit-soft:#fde5e1;
  --shadow:0 1px 2px rgba(22,26,33,.06),0 8px 24px rgba(22,26,33,.08);
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --nav-h:62px;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.shell{min-height:100%;display:block}
.side{display:none}
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.msym{display:block;flex:none;width:34px;height:34px}
.brand b{font-family:"Plus Jakarta Sans",var(--f-body);font-weight:600;font-size:30px;letter-spacing:-.03em;line-height:1;color:var(--bee)}
.brand b .y{color:var(--accent)}
.brand>span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:6px}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.iconbtn svg{width:18px;height:18px}

h1.view{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.viewhead p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2.sec .count{font-family:var(--f-mono);letter-spacing:0;color:var(--ink);background:var(--sunk);border-radius:6px;padding:0 6px}

.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:500;font-size:14px;white-space:nowrap}
.btn svg{width:16px;height:16px}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}
.btn.primary{background:var(--accent);border-color:var(--accent-fg);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}

/* nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a,.side a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:500;position:relative;min-width:0}
.tabbar a span:not(.dot){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar a svg,.side a svg{width:21px;height:21px}
.tabbar a[aria-current="page"]{color:var(--accent-fg)}
.tabbar a[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
.tabbar .dot,.side .dot{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--crit);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;font-family:var(--f-mono)}

@media (min-width:900px){
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr)}
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:20px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
  .side .brand{flex-direction:column;align-items:flex-start;gap:0;padding:0 10px 18px}
  .side .brand b{font-size:38px}
  .side a{flex-direction:row;gap:10px;font-size:14px;padding:9px 10px;border-radius:8px;color:var(--ink)}
  .side a svg{width:18px;height:18px;color:var(--muted)}
  .side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-fg)}
  .side a[aria-current="page"] svg{color:var(--accent-fg)}
  .side .dot{position:static;margin-left:auto}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px}
  .main{padding-block:26px 48px}
  .topbar .brand{visibility:hidden}
  h1.view{font-size:34px}
}

/* banners */
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.stat .n{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat.crit .n{color:var(--crit)} .stat.warn .n{color:var(--warn)}
.stat.crit{border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}

.cols2{display:grid;gap:18px}
@media (min-width:900px){.cols2{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
button.row:hover{background:var(--sunk)}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row .end{display:flex;align-items:center;gap:8px}
.empty{padding:18px 14px;color:var(--muted);font-size:13.5px}

.when{display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:46px;border-radius:8px;background:var(--sunk);line-height:1}
.when .d{font-family:var(--f-display);font-size:20px;font-weight:600}
.when .w{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px}
.when.crit{background:var(--crit-soft);color:var(--crit)} .when.crit .w{color:var(--crit)}
.when.warn{background:var(--warn-soft);color:var(--warn)} .when.warn .w{color:var(--warn)}
.when.done{opacity:.55}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent-fg)}
.tag{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted);white-space:nowrap}

.av{width:var(--s,22px);height:var(--s,22px);border-radius:999px;object-fit:cover;flex:none;display:inline-grid;place-items:center;font-size:10px;font-weight:600;background:var(--sunk);color:var(--muted)}
.av-empty{border:1.5px dashed var(--line);background:transparent}

.check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.check svg{width:14px;height:14px;opacity:0}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check.on svg{opacity:1}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 12px;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;padding:9px 0;width:100%;min-width:0;outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* processo cards */
.proc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:13px 14px}
.proc .cnj{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.proc .cls{font-weight:600}
.proc .parts{font-size:13.5px;overflow-wrap:anywhere}
.proc .parts em{font-style:normal;color:var(--muted);padding:0 4px}
.proc .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.proc .side-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;grid-row:1/4;grid-column:2}

/* agenda */
.cal-wrap{display:grid;gap:16px}
@media (min-width:900px){.cal-wrap{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-family:var(--f-display);font-size:20px;font-weight:600;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-grid .wd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.day{aspect-ratio:1/1;max-width:100%;border:0;border-radius:8px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-variant-numeric:tabular-nums;font-size:14px;position:relative}
@media (min-width:900px){.day{aspect-ratio:auto;height:64px}}
.day:hover{background:var(--sunk)}
.day.out{color:var(--muted);opacity:.45}
.day.nu{color:var(--muted)}
.day.today .dn{background:var(--ink);color:var(--bg);border-radius:999px;width:26px;height:26px;display:grid;place-items:center}
.day.sel{background:var(--accent-soft)}
.day .marks{display:flex;gap:3px}
.day .marks i{width:6px;height:6px;border-radius:99px;background:var(--accent)}
.day .marks i.p{background:var(--warn)}
.day .marks i.pc{background:var(--crit)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:99px;display:inline-block}

/* kanban */
.kanban-scroll{overflow-x:auto;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scroll-snap-type:x mandatory}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;padding-bottom:6px;min-width:min-content}
.kcol{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;scroll-snap-align:start}
.kcol.over{outline:2px dashed var(--accent-fg);outline-offset:-2px}
.kcol h3{margin:0 0 2px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.kcol h3 span{font-family:var(--f-mono);color:var(--muted);font-weight:400}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.kcard .kt{font-weight:500;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left}
.kcard .kf{display:flex;align-items:center;gap:6px;justify-content:space-between}
.kcard .mv{display:flex;gap:2px}
.kcard .mv button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:28px;height:26px;display:grid;place-items:center;padding:0}
.kcard .mv svg{width:14px;height:14px}
.kcard.dragging{opacity:.4}
.kcol.feito .kt{text-decoration:line-through;color:var(--muted)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-height:92%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media (min-width:700px){.overlay{align-items:center;padding:24px}.sheet{max-width:620px;border-radius:16px;max-height:90vh}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.sheet-b{overflow-y:auto;padding:16px max(18px,env(safe-area-inset-right,0px)) 16px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-f .r{display:flex;gap:8px;margin-left:auto}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:1/-1;min-width:0}
.f.half{grid-column:span 1}
@media (max-width:480px){.f.half{grid-column:1/-1}}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.f textarea{min-height:76px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.f .hint.ok{color:var(--ok)} .f .hint.bad{color:var(--crit)}
.calc{grid-column:1/-1;background:var(--sunk);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.calc .ttl{grid-column:1/-1;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.calc .out{grid-column:1/-1;font-size:13px}
.calc .out b{font-family:var(--f-mono)}
.calc .tiny{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:6px;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.kgrid.neg{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.kgrid.neg{grid-template-columns:repeat(3,minmax(0,1fr))}}
.callout{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:12px 14px;font-size:13.5px;background:color-mix(in srgb,var(--c-late) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c-late) 40%,transparent)}
.callout.crit{background:color-mix(in srgb,var(--c-lost) 10%,var(--surface));border-color:color-mix(in srgb,var(--c-lost) 40%,transparent)}
.callout svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--c-late)}.callout.crit svg{color:var(--c-lost)}
.nbar{grid-template-columns:minmax(90px,180px) minmax(0,1fr) 40px}
.cols2>*{min-width:0}
.kgrid.neg .kv{white-space:nowrap}
@media (max-width:700px){.kgrid.neg .kv{font-size:23px}.vchart.dense .vcol:nth-child(even) .vlbl{visibility:hidden}.nbar{grid-template-columns:minmax(70px,120px) minmax(0,1fr) 36px}}
.przpub{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:13px}
.przpub svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--accent-fg)}
.sugprz{grid-column:1/-1;background:var(--accent-soft);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.sugprz.none{background:var(--sunk);font-size:13px;color:var(--muted)}
.sugprz .ttl{font-size:12.5px;font-weight:700}
.sugprz .tiny{font-size:12px;color:var(--ink)}
.sopt{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;color:var(--ink);cursor:pointer}
.sopt span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.sopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.inline{display:flex;align-items:center;gap:8px;font-size:13.5px}
.inline input{width:auto}

.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.dl div{min-width:0}
.dl dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.dl dd{margin:2px 0 0;overflow-wrap:anywhere}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 14px 16px}
.tl::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:99px;background:var(--surface);border:2px solid var(--accent-fg)}
.tl .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tl p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.addand{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.addand textarea{grid-column:1/-1}
.addand input,.addand textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
.addand .btn{justify-self:end;grid-column:1/-1}

.welcome{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.welcome h2{font-family:var(--f-display);font-size:24px;margin:0;font-weight:600;text-wrap:balance}
.welcome ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.welcome ol b{color:var(--ink);font-weight:600}
.welcome .acts{display:flex;gap:8px;flex-wrap:wrap}

.people{display:flex;flex-direction:column;gap:2px}
.person{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person .nm{flex:1;min-width:0;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 16px;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:24px}}
.fab{display:inline-flex}
/* publicações */
.pubs{display:flex;flex-direction:column;gap:10px}
.pub{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pub.nova{border-left:3px solid var(--accent)}
.pub .ph{display:flex;gap:10px;align-items:flex-start}
.pub .ph .meta{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pub .chips{gap:5px}
.pub .cnjl{font-family:var(--f-mono);font-size:13px}
.pub .org{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.pub .partes{font-size:13px;overflow-wrap:anywhere}
.pub .partes span{color:var(--muted)}
.pub .txt{font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:8px;padding:10px 12px;max-height:none}
.pub .txt.cut{max-height:7.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.pub .acts{display:flex;gap:6px;flex-wrap:wrap}
.pub .acts .btn{padding:6px 12px;font-size:13px}
.syncbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:13.5px}
.syncbar .grow{flex:1 1 220px;min-width:0}
.spin{width:14px;height:14px;border-radius:99px;border:2px solid var(--line);border-top-color:var(--accent-fg);display:inline-block;vertical-align:-2px}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sug button{font-size:12px;padding:4px 10px}
.oabrow{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:8px}
.oabrow input,.oabrow select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
.oabrow .full{grid-column:1/-1}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
/* ===== Layout em estilo de sistema de gestão: barra superior com busca, menu lateral, painel com widgets ===== */
:root{--f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-display:"Nunito Sans",system-ui,sans-serif;--bg:#ffffff;--side:#ffffff;--sunk:#f3f4f6;--line:#e3e6eb;--r:6px;--bar-h:64px}
body{font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--bar-h);background:var(--surface);box-shadow:0 1px 0 var(--line),0 2px 8px rgba(20,24,30,.05);display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.appbar .brand{text-decoration:none;flex:none}
.appbar .brand b{font-size:32px}
.gsearch{position:relative;flex:1 1 auto;max-width:440px;display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-width:0}
.gsearch input{border:0;background:transparent;padding:9px 12px;width:100%;min-width:0;outline:none;font-size:14px}
.gsearch svg{width:17px;height:17px;color:var(--muted);margin-right:10px;flex:none}
.gsearch:focus-within{border-color:var(--accent)}
.gres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:40}
.gres button{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-top:1px solid var(--line)}
.gres button:first-child{border-top:0}
.gres button:hover,.gres button:focus{background:var(--sunk)}
.gres .gt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.gres .gl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gres .empty{padding:12px}
.appbar-r{margin-left:auto;display:flex;align-items:center;gap:4px;position:relative}
.appbar-r .iconbtn{border:0;background:transparent;border-radius:6px}
.appbar-r .iconbtn:hover{background:var(--sunk)}
.userbtn{border:0;background:transparent;padding:8px 6px 8px 10px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.userbtn .car{font-size:11px;color:var(--muted)}
[hidden]{display:none!important}
.addmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);min-width:200px;padding:6px;z-index:40;display:flex;flex-direction:column}
.addmenu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:4px;display:flex;gap:10px;align-items:center;font-size:14px}
.addmenu button:hover{background:var(--sunk)}
.addmenu svg{width:17px;height:17px;color:var(--muted)}
.shell{min-height:calc(100% - var(--bar-h))}
.main{padding-block:20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));max-width:1360px}
.userbtn .ui{display:none}.userbtn .ui svg{width:20px;height:20px}
@media (max-width:560px){.appbar .userbtn .nm,.appbar .userbtn .car{display:none}.appbar .userbtn .ui{display:inline-grid}.appbar .brand b{font-size:28px}.appbar{gap:8px}}
@media (min-width:900px){
 .shell{grid-template-columns:248px minmax(0,1fr)}
 .side{top:calc(var(--bar-h) + env(safe-area-inset-top,0px));height:calc(100vh - var(--bar-h) - env(safe-area-inset-top,0px));background:var(--side);padding:16px 12px;gap:2px;border-right:1px solid var(--line);overflow-y:auto}
 .side a{padding:9px 12px;border-radius:6px;font-size:15px;font-weight:400;gap:12px}
 .side a svg{width:18px;height:18px}
 .side a:hover{background:var(--sunk)}
 .side a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
 .side a[aria-current="page"] svg{color:var(--accent-fg)}
 .side .foot{border-top:1px solid var(--line);padding-top:12px}
 .side .foot .btn{justify-content:flex-start;padding:9px 12px;font-size:15px;color:var(--ink);border-radius:6px;width:100%}
 .side .foot .btn:hover{background:var(--sunk)}
 .main{margin:0;padding-block:24px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
}
.dot,.side .dot,.tabbar .dot{border-radius:3px!important;background:var(--crit)!important;color:#fff!important;font-family:var(--f-body)!important;font-weight:700;min-width:18px;height:18px;font-size:11px}
h1.view{font-family:var(--f-body);font-weight:300;font-size:28px;letter-spacing:-.01em}
@media (min-width:900px){h1.view{font-size:32px}}
.viewhead{align-items:center}
.btn{border-radius:4px;font-weight:600}
.btn.primary{text-transform:uppercase;letter-spacing:.04em;font-size:13px;font-weight:800;padding:10px 18px}
.btn.primary svg{display:none}
.iconbtn.sq{border-radius:4px;width:34px;height:34px;background:var(--sunk);border:0}
.chip{border-radius:4px}
.search{border-radius:4px}
.list,.pub,.syncbar,.cal,.stat,.welcome{border-radius:6px}
h2.sec{font-size:12px}
/* painel */
.ws{display:grid;gap:24px}
@media (min-width:1100px){.ws{grid-template-columns:minmax(0,1fr) 400px;align-items:start}}
.wsmain{display:flex;flex-direction:column;gap:14px;min-width:0}
.wsside{display:flex;flex-direction:column;gap:18px;min-width:0}
.listhead{display:flex;justify-content:space-between;align-items:center;background:var(--sunk);border-radius:4px;padding:10px 14px}
.listhead .lh{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.tlist{border-top:1px solid var(--line)}
.trow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:12px 6px;border-bottom:1px solid var(--line)}
.tcheck{width:22px;height:22px;border:1.6px solid color-mix(in srgb,var(--muted) 55%,transparent);background:var(--surface);color:transparent;padding:0;display:grid;place-items:center;border-radius:6px;margin-top:1px;cursor:pointer;transition:background .12s,border-color .12s}
.tcheck svg{width:14px;height:14px;stroke-width:3}
.tcheck:hover{border-color:var(--ok);color:color-mix(in srgb,var(--ok) 55%,transparent);background:var(--ok-soft)}
.tcheck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tbody{min-width:0}
.tlink{border:0;background:none;padding:0;color:var(--accent-fg);font-size:15px;text-align:left;overflow-wrap:anywhere}
.tlink:hover{text-decoration:underline}
.tdate{font-size:15px;color:var(--muted)}
.tdate.crit{color:var(--crit)}
.tmeta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.tkind{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.chip-eu{border:1px solid var(--line);border-radius:3px;padding:0 5px;font-size:10.5px;font-weight:700;color:var(--muted)}
.wlink{border:0;background:none;padding:0;color:var(--accent-fg);text-decoration:none;font-size:14px;text-align:left;font-weight:600}
.wlink:hover{text-decoration:underline}
.wlink.crit{color:var(--crit)}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.widget .wh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.widget h2{margin:0;font-size:17px;font-weight:700}
.wtoggle{border:0;background:none;padding:0;color:var(--muted);font-size:12.5px;margin-top:2px}
.wtoggle .car{display:inline-block;transition:transform .15s}.wtoggle .car.up{transform:rotate(180deg)}
.widget .wb{display:flex;flex-direction:column;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.kpis b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.kpis b.crit{color:var(--crit)}
.kpis span{font-size:12.5px;color:var(--muted)}
.hb{display:grid;grid-template-columns:64px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px}
.hbl{color:var(--muted);text-align:right}
.hbt{display:flex;height:22px;background:var(--sunk);border-radius:3px;overflow:hidden}
.hbt i{display:block;height:100%}
.hbt i.ok{background:var(--ok)}.hbt i.crit{background:var(--crit)}.hbt i.pend{background:var(--accent)}
.hbn{text-align:right;font-weight:700}
.mini{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;border:0;background:none;padding:7px 0;text-align:left;border-top:1px solid var(--line);font-size:14px}
.mrow:first-child{border-top:0}
.mrow .md{color:var(--muted);font-size:13px}
.mrow .mt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* indicadores */
:root{--s-pend:#c9ccd3;--s-late:#E39B0B}
.s-ok{background:var(--ok)}.s-late{background:var(--s-late)}.s-warn{background:var(--warn)}.s-crit{background:var(--crit)}.s-pend{background:var(--s-pend)}
.legend i.s-ok,.legend i.s-late,.legend i.s-warn,.legend i.s-crit,.legend i.s-pend{width:9px;height:9px;border-radius:2px}
.ipbar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.ipnav{display:flex;align-items:center;gap:8px;min-width:0}
.iplabel{font-size:15px;font-weight:700;text-transform:none;white-space:nowrap}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:7px 10px;margin-left:auto;max-width:100%}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.kgrid{grid-template-columns:1.4fr repeat(5,minmax(0,1fr))}}
.ktile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ktile.hero{grid-column:1/-1;background:var(--accent-soft);border-color:transparent}
@media (min-width:760px){.ktile.hero{grid-column:auto}}
.ktile.alert{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.kl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kl i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.kv{font-size:30px;font-weight:700;line-height:1.05}
.ktile.hero .kv{font-size:40px}
.ks{font-size:12px;color:var(--muted)}
.kline{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;font-size:13.5px}
.kline .crit,.kpis .crit,.itab .crit{color:var(--crit)}
.vchart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;height:220px}
.vaxis{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--muted);text-align:right;padding-bottom:20px;margin-top:-6px}
.vaxis span{line-height:1}
.vplot{position:relative;min-width:0;overflow-x:auto}
.vgrid{position:absolute;inset:0 0 20px 0;pointer-events:none}
.vgrid i{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.vcols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),minmax(10px,1fr));gap:2px}
.vcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;outline-offset:-2px;border-radius:4px}
.vcol:hover,.vcol:focus{background:var(--sunk)}
.vcol .vstack{width:min(24px,70%);height:calc((100% - 20px) * var(--h));display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
.vcol .vstack i{display:block;min-height:3px}
.vcol .vstack i:first-child{border-radius:4px 4px 0 0}
.vlbl{position:absolute;bottom:2px;font-size:10.5px;color:var(--muted)}
.vcol{position:relative}
.vlbl.wk{opacity:.55}
.vcol.now .vlbl{color:var(--ink);font-weight:800}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(80px,160px) minmax(0,1fr) 32px;gap:10px;align-items:center;font-size:13.5px;cursor:pointer;border-radius:4px;padding:2px 0}
.hbar:hover,.hbar:focus{background:var(--sunk)}
.hbn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtrack{display:flex;gap:2px;height:18px}
.hbtrack i{display:block;height:100%}
.hbtrack i:last-child{border-radius:0 4px 4px 0}
.hbv{text-align:right;font-weight:700}
.tablewrap{overflow-x:auto}
.itab{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
.itab th{text-align:right;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.itab th:first-child,.itab td:first-child{text-align:left}
.itab td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}
.itab .who{display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.tip{position:fixed;z-index:70;max-width:280px;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:6px;box-shadow:var(--shadow);pointer-events:none}
.tabbar{grid-template-columns:repeat(7,1fr)}
.tabbar a{font-size:9px;letter-spacing:-.01em}
.tabbar a svg{width:20px;height:20px}

/* honorários */
.hon{display:grid;gap:18px}
@media (min-width:1100px){.hon{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}}
.hside{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1099px){.hside{order:-1}}
.hk{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.hk{grid-template-columns:1.3fr repeat(3,minmax(0,1fr))}}
.ktile.atr{text-decoration:none;color:inherit}
.ktile.atr.on{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.ktile.atr.on .kv{color:var(--crit)}
.ktile.atr.on .ks{color:var(--crit);opacity:.85}
.ocrow{grid-template-columns:minmax(0,1fr)!important;gap:8px}
.ocend{flex-wrap:wrap;justify-content:flex-start;gap:8px}
.ocend .btn{margin-left:auto}
.atrbox{display:flex;flex-direction:column;gap:8px;border:1px solid color-mix(in srgb,var(--crit) 35%,var(--line));border-radius:6px;padding:12px;background:color-mix(in srgb,var(--crit-soft) 55%,var(--surface))}
.atrh{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--crit)}
.atrh span{display:flex;align-items:center;gap:8px}.atrh svg{width:18px;height:18px}
.atrh b{font-size:15px}
.hk .kv{font-size:clamp(20px,2.6vw,30px)}.hk .kv.hv{font-size:clamp(17px,1.8vw,22px)}
.wb>.search{flex:0 0 auto}
.clist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 4px}
.crow:hover{background:var(--sunk)}
.cmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.cmain b{font-weight:700;overflow-wrap:anywhere}
.cmain .s,.cval .s{font-size:12.5px;color:var(--muted)}
.cval{display:flex;flex-direction:column;align-items:flex-end;font-weight:700;white-space:nowrap}
.hday{justify-content:flex-start;gap:2px}
.hday .hamt{font-size:10.5px;font-weight:700;line-height:1.1;padding:1px 4px;border-radius:3px;white-space:nowrap;background:var(--accent-soft);color:var(--ink)}
.hday .hamt.ok{background:var(--ok-soft)}
.hday .hamt.crit{background:var(--crit-soft);color:var(--crit)}
.hday .hdot{display:none;width:7px;height:7px;border-radius:99px;background:var(--accent)}
.hday .hdot.ok{background:var(--ok)}.hday .hdot.crit{background:var(--crit)}
@media (max-width:700px){.hday .hamt{display:none}.hday .hdot{display:block}}
@media (min-width:900px){.hday{height:68px}}
.tblock{grid-column:1/-1}
.tblock>.form{background:var(--sunk);border-radius:6px;padding:12px}
@media (max-width:899px){
 .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
 .tabbar a,.tabbar .tbmais{font-size:10.5px}
}

 if(!oabs.length){toast('Cadastre as OABs do escritório em Equipe e ajustes.');openEquipe();return}

 const step=m=>{S.busy={msg:m};schedule()};
 const djen=async(label,urlFn,tag)=>{let per=100,pg=1,guard=0,n=0;
  while(guard++<150){step(`DJEN · ${label} · página ${pg}${total?` · ${total} encontradas`:''}`);
   const {raw,j}=await abrirJson(ctx,urlFn(pg,per));const items=j&&(j.items||j.itens||j.data||j.comunicacoes);
   if(!j||!Array.isArray(items)){if(per===100){per=5;pg=1;continue}
    const t=(typeof raw==='string'?raw:'').replace(/\s+/g,' ').slice(0,120);throw new Error(`resposta inesperada do DJEN${t?` (“${t}”)`:''}`)}
   if(!items.length&&Number(j.count)>0&&per===100){pg=(pg-1)*20+1;per=5;continue}
   n+=items.length;total+=items.length;novos+=await salvarPubs(items.map(it=>normPub(it,tag)));
   const cnt=Number(j.count);if(items.length<per||(isFinite(cnt)&&j.count!==undefined&&j.count!==null&&j.count!==''&&pg*per>=cnt))break;pg++;await sleep(700)}
  return n};
 const qd=async(term,ini)=>{let off=0,n=0,guard=0;

   if(!j||!Array.isArray(gs)){const t=(typeof raw==='string'?raw:'').replace(/\s+/g,' ').slice(0,120);throw new Error(`resposta inesperada do Querido Diário${t?` (“${t}”)`:''}`)}
   const ok=gs.filter(g=>{const d=normData(pick(g,'date'));return!d||d>=ini});

  return n};

  for(const o of oabs){const tag=`${o.numero}/${o.uf}`;
   const k1='oab:'+tag,i1=iniDe(k1);await run('djen',`DJEN OAB ${tag}`,()=>djen(`OAB ${tag}`,(pg,per)=>djenUrl(o,i1,fim,pg,per),tag),k1);

  for(const k of okKeys)ult[k]=fim;
  if(S.db){try{await S.db.doc('config/monitoramento').update({ultimaPor:ult,ultimaBusca:okKeys.length?fim:(S.mon.ultimaBusca||null),
   ultimoResultado:{em:now(),total,novos,porFonte,erros:erros.slice(0,6),por:S.meId||null}})}catch(e){try{await S.db.doc('config/monitoramento').set({...S.mon,ultimaPor:ult,ultimaBusca:okKeys.length?fim:(S.mon.ultimaBusca||null),ultimoResultado:{em:now(),total,novos,porFonte,erros:erros.slice(0,6),por:S.meId||null}})}catch(e2){}}}
  S.busy=null;schedule();
  if(erros.length)toast(`Busca concluída com ${erros.length} falha(s). Veja em Equipe e ajustes.`);else if(!auto||novos)toast(novos?`${novos} publicação(ões) nova(s) importada(s)`:'Nenhuma publicação nova no período');

 const out={};const usados=new Set();
 for(const d of ks){if(novas.some(o=>o.data===d)&&!usados.has(d)){out[d]=pg[d];usados.add(d);continue}
  let alvo=null;const i=velhas.findIndex(o=>o.data===d);

 return out}

const CONTAGENS=[['uteis','Dias úteis (CPC, art. 219)'],['corridos','Dias corridos (início e fim em dia útil, suspensos no recesso)'],['eleitoral','Período eleitoral: contínuos, sem prorrogação'],['horas','Horas']];
function calcularPrazo(o){
 const dobro=o.dobro?2:1;const n=Math.max(0,Math.round(Number(o.qtd)||0))*dobro;
 let ini=o.data;const linhas=[];
 if(o.base==='disponibilizacao'&&o.modo!=='horas'){const pub=proximoUtil(o.data);linhas.push(`Disponibilizada em ${fmtD(o.data)}; considera-se publicada em ${fmtD(pub)} (1º dia útil seguinte).`);ini=pub}
 if(o.modo==='horas'){const h=String(o.hora||'00:00').split(':').map(Number);const t0=new Date(parse(o.data));t0.setHours(h[0]||0,h[1]||0,0,0);const t1=new Date(t0.getTime()+n*36e5);
  return{fim:iso(t1),hora:`${pad(t1.getHours())}:${pad(t1.getMinutes())}`,linhas:[...linhas,`${n} hora(s) a partir de ${fmtD(o.data)} às ${pad(h[0]||0)}:${pad(h[1]||0)}.`,'Prazo em horas conta minuto a minuto, inclusive à noite, em fins de semana e feriados.'],n}}
 if(o.modo==='uteis'){const r=calcPrazo(ini,n);linhas.push(`${n} dia(s) úteis contados a partir do dia útil seguinte a ${fmtD(ini)}.`);if(r.pulos.length)linhas.push('Dias não contados: '+r.pulos.map(([d,x])=>`${fmtDM(d)} (${x})`).join(', ')+'.');return{fim:r.fim,linhas,n}}
 if(o.modo==='corridos'){if(!n)return{fim:ini,linhas,n};let d=proximoUtil(ini),c=1,g=0,susp=0;
  linhas.push(`${n} dia(s) corridos. A contagem começa em ${fmtD(d)}, 1º dia útil após ${fmtD(ini)} (CPC, art. 224, §§ 1º e 3º).`);
  while(c<n&&g++<5000){d=addDays(d,1);if(recesso(d)){susp++;continue}c++}
  if(susp)linhas.push(`Contagem suspensa de 20/12 a 20/01 (CPC, art. 220): ${susp} dia(s) não contados.`);
  let fim=d;const orig=fim;while(naoUtil(fim))fim=addDays(fim,1);if(fim!==orig)linhas.push(`O último dia (${fmtD(orig)}, ${naoUtil(orig)}) não é útil: prorrogado para ${fmtD(fim)}.`);
  return{fim,linhas,n}}

 {linhas.push('No período eleitoral, os prazos são contínuos e peremptórios: correm em sábados, domingos e feriados e não se prorrogam (LC 64/1990, art. 16).');if(naoUtil(fim))linhas.push(`Atenção: o prazo termina em dia não útil (${naoUtil(fim)}). Confira o horário de funcionamento do cartório ou do plantão.`)}
 return{fim,linhas,n}}

function wireKanban(){

function formPrazo(p,preset={}){const isNew=!p;const fromPub=preset.fromPub||null;

 const sugBox=fromPub&&isNew?(sugs.length?`<div class="sugprz"><div class="ttl">${sugs.length>1?'A publicação indica estes prazos. Escolha um:':'Prazo indicado na publicação'}</div>${sugs.map((x,i)=>`<button type="button" class="sopt" data-act="prz-sug" data-i="${i}" aria-pressed="${i===0}"><b>${esc(x.acao||'Prazo')} · ${x.n} ${x.unidade}${x.qual?' '+(x.qual==='uteis'?'úteis':'corridos'):''}</b><span>“${esc(x.trecho)}”</span></button>`).join('')}<div class="tiny" id="sugWhy"></div></div>`:`<div class="sugprz none">A publicação não diz o prazo de forma expressa. Informe à mão.</div>`):'';
 if(sugs.length){const x=sugs[0],c=contagemSugerida(x,fromPub,procP);preset={...preset,descricao:preset.descricao||x.acao,dias:x.n,contagem:c.modo,obs:`Trecho da publicação: “${x.trecho}”`}}
 p=p||{status:'pendente',responsavel:S.meId||'',processoId:preset.processoId||'',intimacao:preset.intimacao||'',descricao:preset.descricao||'',dias:preset.dias||'',contagem:preset.contagem||'uteis',hora:preset.hora||'',dobro:!!preset.dobro,dataFatal:preset.dataFatal||'',obs:preset.obs||''};
 const cont=p.contagem||'uteis';
 openSheet('prazo',isNew?'Novo prazo':'Editar prazo',`<div class="form">
  ${sugBox}
  ${fld('Ato / prazo',inp('descricao',p.descricao,'placeholder="Contestação, Apelação, Manifestação sobre laudo…"'))}
  ${fld('Processo',selProc(p.processoId))}
  <div class="calc"><div class="ttl"><span>Calcular pela intimação</span></div>
   ${fld('Contagem',`<select name="contagem" id="f-contagem">${CONTAGENS.map(([k,l])=>opt(k,l,cont)).join('')}</select>`)}
   ${fld('Data da intimação',inp('intimacao',p.intimacao||'','type="date"'),'half')}
   ${fld('<span id="diasLbl">Prazo</span>',inp('dias',p.dias||'','type="number" min="1" max="365" inputmode="numeric" placeholder="15"'),'half')}
   <div class="f half" id="horaBox" ${cont==='horas'?'':'hidden'}><label>Hora da intimação</label><input name="hora" id="f-hora" type="time" value="${esc(p.hora||'')}"></div>
   <label class="inline" style="grid-column:1/-1"><input type="checkbox" name="dobro" id="f-dobro" ${p.dobro?'checked':''}> Prazo em dobro (Fazenda Pública, Defensoria, litisconsortes com procuradores distintos em autos físicos)</label>
   ${fromPub?`<div class="tiny" style="color:var(--ink)">${fromPub.disponibilizacao?`${esc(pubDataTxt(fromPub))}. Essa data entrou como data da intimação.`:'A publicação não tem data identificada: informe a data da intimação à mão.'}</div>`:''}
   <div class="out" id="calcOut"></div>
   <div class="tiny">Considera fins de semana, feriados nacionais e o recesso de 20/12 a 20/01. Feriados estaduais, municipais e suspensões do tribunal não entram: confira o calendário do tribunal.</div></div>
  ${fld('Data fatal',inp('dataFatal',p.dataFatal||'','type="date" required'),'half')}
  ${fld('Situação',`<select name="status" id="f-status">${opt('pendente','Pendente',p.status)}${opt('cumprido','Cumprido',p.status)}${opt('perdido','Perdido (não cumprido)',p.status)}</select>`,'half')}

  ${fld('Observações',`<textarea name="obs" id="f-obs">${esc(p.obs||'')}</textarea>`)}
 </div>`,footFor(isNew,'prazo'),{id:p.id,isNew,orig:isNew?{}:p,fromPub});
 const run=()=>{const i=$('#f-intimacao').value,dRaw=parseInt($('#f-dias').value,10),dob=$('#f-dobro').checked,o=$('#calcOut'),modo=$('#f-contagem').value;
  $('#horaBox').hidden=modo!=='horas';$('#diasLbl').textContent=modo==='horas'?'Prazo em horas':modo==='uteis'?'Prazo em dias úteis':'Prazo em dias corridos';

  if(modo==='uteis'){const d=dob?dRaw*2:dRaw;const r=calcPrazo(i,d);$('#f-dataFatal').value=r.fim;

  const r=calcularPrazo({data:i,base:'intimacao',modo,qtd:dRaw,dobro:dob,hora:$('#f-hora').value});$('#f-dataFatal').value=r.fim;
  o.innerHTML=`Vence em <b>${esc(fmtD(r.fim))}${r.hora?' às '+esc(r.hora):''}</b> (${WD[parse(r.fim).getDay()]})<br><span class="muted">${r.linhas.map(esc).join(' ')}</span>`};
 const why=()=>{const w=$('#sugWhy');if(!w||!sugs.length)return;const k=Number(($('.sopt[aria-pressed="true"]')||{}).dataset?.i||0);w.textContent='Contagem: '+contagemSugerida(sugs[k],fromPub,procById($('#f-proc').value)||procP).porque+' Confira antes de salvar.'};
 if(S.sheet)S.sheet.przSug={sugs,apply:(k)=>{const x=sugs[k];if(!x)return;document.querySelectorAll('.sopt').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.i)===k)));
  if(x.acao)$('#f-descricao').value=x.acao;$('#f-dias').value=x.n;$('#f-contagem').value=contagemSugerida(x,fromPub,procById($('#f-proc').value)||procP).modo;$('#f-obs').value=`Trecho da publicação: “${x.trecho}”`;why();run()}};
 ['f-intimacao','f-dias','f-dobro','f-contagem','f-hora'].forEach(id=>{$('#'+id).addEventListener('input',run);$('#'+id).addEventListener('change',run)});why();if(isNew&&p.intimacao)run()}

const COLOF={proposta:'propostas',contrato:'contratos',processo:'processos',prazo:'prazos',evento:'eventos',tarefa:'tarefas'};
async function save(kind){if(kind==='contrato')return salvarContrato();const sh=S.sheet;const d=formData();
 if(kind==='processo'&&!d.cliente&&!d.numero&&!d.classe){toast('Informe ao menos o cliente, a ação ou o número.');return}
 if(kind==='prazo'){if(!d.descricao){toast('Descreva o prazo.');return}if(!d.dataFatal){toast('Informe a data fatal ou calcule pela intimação.');return}d.dias=d.dias?Number(d.dias):'';}
 if(kind==='evento'&&!d.data){toast('Informe a data do compromisso.');return}
 if(kind==='evento'&&!d.titulo)d.titulo=d.tipo;
 if(kind==='tarefa'&&!d.titulo){toast('Dê um nome à tarefa.');return}
 if(kind==='tarefa'){d.coluna=d.concluida?'feito':(sh.orig.coluna&&sh.orig.coluna!=='feito'?sh.orig.coluna:'afazer');delete d.concluida;if(d.coluna==='feito'){d.concluidaEm=sh.orig.concluidaEm||now()}else d.concluidaEm=null}
 if(kind==='prazo'){if(d.status==='cumprido'){d.cumpridoEm=d.cumpridoEm||sh.orig.cumpridoEm||today()}else d.cumpridoEm=''}
 const col=COLOF[kind];const id=sh.isNew?newId(col):sh.id;
 const base=sh.isNew?{}:{...sh.orig};const doc=stamp({...base,...d},sh.isNew);
 const fp=sh.fromPub;
 if(fp&&kind==='processo'&&sh.isNew){const resumo=stripHtml(fp.texto).replace(/\s+/g,' ').slice(0,700);
  doc.andamentos=[{data:fp.disponibilizacao,texto:`Publicação no DJEN${fp.tipo?' ('+fp.tipo+')':''}: ${resumo}${resumo.length>=700?'…':''}`,autor:S.meId||null,em:now()}]}
 const btn=$('[data-act="save"]');if(btn)btn.disabled=true;
 const ok=await put(col,id,doc);if(btn)btn.disabled=false;
 if(ok&&fp&&fp.id){const up={atualizadoEm:now()};if(kind==='processo')up.processoId=id;if(kind==='prazo'){up.prazoId=id;up.status='tratada';up.tratadaEm=now();up.tratadaPor=S.meId||null}
  if(fp.id&&(kind==='processo'||kind==='prazo'))await patch('publicacoes',fp.id,up)}
 if(ok){const back=sh.back;closeSheet();
  if(fp&&kind==='processo'){toast('Processo cadastrado. Lance o prazo, se houver.');openDetail(id);return}
  toast({processo:'Processo salvo',prazo:fp?'Prazo lançado e publicação tratada':'Prazo salvo',evento:'Compromisso salvo',tarefa:'Tarefa salva'}[kind]);if(back)openDetail(back)}}
async function del(kind,btn){if(!btn.classList.contains('armed')){btn.classList.add('armed');
  const extra=kind==='processo'?(()=>{const n=S.prazos.filter(p=>p.processoId===S.sheet.id).length+S.eventos.filter(e=>e.processoId===S.sheet.id).length;return n?` e ${n} prazo(s)/compromisso(s)`:''})():'';
  btn.textContent='Confirmar exclusão'+extra;return}
 const id=S.sheet.id,back=S.sheet.back;const ok=await remove(COLOF[kind],id);
 if(ok&&kind==='processo'){for(const p of S.prazos.filter(x=>x.processoId===id))await remove('prazos',p.id);for(const e of S.eventos.filter(x=>x.processoId===id))await remove('eventos',e.id)}
 if(ok){closeSheet();toast('Excluído');if(back&&kind!=='processo')openDetail(back)}}

async function addAndamento(){const id=S.sheet.id,p=procById(id);const t=$('#andTexto').value.trim(),d=$('#andData').value||today();if(!t){toast('Escreva o andamento.');return}

async function refreshEquipe(){const b=$('#sheetBody');if(!b)return;const admin=S.user?await S.user.canEdit():false;if(!S.sheet||S.sheet.kind!=='equipe')return;
 const ids=[...new Set([...(S.equipe||[]),...(S.meId?[S.meId]:[])])];const exN=COLS.reduce((n,c)=>n+S[c].filter(x=>x.exemplo).length,0)+S.pubs.filter(x=>x.exemplo).length+S.contratos.filter(x=>x.exemplo).length+S.modelos.filter(x=>x.exemplo).length+S.clientes.filter(x=>x.exemplo).length+Object.values(S.confs||{}).filter(c=>c&&c.exemplo).length;
 const qv=$('#busca')?$('#busca').value:'';const foc=document.activeElement&&['oabNum','oabNome','termos'].includes(document.activeElement.id)?document.activeElement.id:null;
 const keep={n:$('#oabNum')?$('#oabNum').value:'',u:$('#oabUf')?$('#oabUf').value:'AL',m:$('#oabNome')?$('#oabNome').value:'',t:$('#termos')?$('#termos').value:null};
 const oabs=S.mon.oabs||[];const ur=S.mon.ultimoResultado;

const MESES_RE={janeiro:1,fevereiro:2,'março':3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
function dataExtenso(t){const m=String(t).match(/(\d{1,2}) de (janeiro|fevereiro|março|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro) de (\d{4})/i);return m?`${m[3]}-${pad(MESES_RE[m[2].toLowerCase()])}-${pad(m[1])}`:''}
function ehMural(t){return/Publica[çc][ãa]o n[ºo°.]?\s*\d+\/\d{4}/i.test(t)&&/Processo:\s*\d/.test(t)}
function parseMural(txt,dataPadrao){
 return txt.split(/(?=Publica[çc][ãa]o n[ºo°.]?\s*\d+\/\d{4})/i).filter(p=>/Processo:\s*\d/.test(p)).map(p=>{
  const g=re=>{const m=p.match(re);return m?m[1].trim():''};
  const num=g(/Processo:\s*([\d.\-]+)/),id=g(/Publica[çc][ãa]o n[ºo°.]?\s*(\d+\/\d{4})/);const dia=dataPadrao||dataExtenso(p)||'';const un=g(/Unidade publicadora:\s*([^\n]+)/);
  const advs=[...p.matchAll(/Advogad[oa]\(a\):\s*([^(\n]+?)\s*\(OAB:\s*([^)]+)\)/gi)].map(m=>{const o=m[2].trim();const uf=(o.match(/\/([A-Z]{2})/)||[])[1]||'';return{nome:m[1].trim(),oab:dig(o.split('/')[0]),uf}});
  const partes=[...p.matchAll(/^\s*([A-ZÁÉÍÓÚÂÊÔÃÕÇ ]{4,40}):\s*(.+)$/gm)].filter(m=>!/ADVOGAD|FISCAL DA LEI/i.test(m[1])&&!/^(PROCESSO|ASSUNTO|PUBLICA)/i.test(m[1])).slice(0,8).map(m=>({nome:m[2].trim().slice(0,160),polo:m[1].trim().toLowerCase()}));
  return{fonte:'Mural eletrônico',dataTipo:'publicacao',djenId:id?'mural'+dig(id)+'-'+dig(num).slice(0,20)+'-'+nfold(un).replace(/[^a-z0-9]/g,'').slice(0,40):'',hash:'',numero:cnjMask(num),tribunal:cnjTribunal(num)||'Justiça Eleitoral',
   orgao:[g(/Unidade publicadora:\s*([^\n]+)/),g(/Proced[êe]ncia:\s*([^\n]+)/)].filter(Boolean).join(' · '),classe:g(/Assunto:\s*([^\n]+)/),tipo:g(/Tipo de ato:\s*\n?\s*([^\n]+)/)||'Decisão',
   tipoDocumento:'',disponibilizacao:dia,texto:p.trim().slice(0,60000),link:'https://mural-consulta.tse.jus.br/',destinatarios:partes,advogados:advs,oab:'',status:'nova'}})}
function doEscritorio(p){const oabs=S.mon.oabs||[];const nomes=termosBusca().map(n=>n.toLowerCase());if(!oabs.length&&!nomes.length)return true;
 const t=(p.texto+' '+(p.advogados||[]).map(a=>a.nome+' '+a.oab).join(' ')).toLowerCase();
 return oabs.some(o=>(p.advogados||[]).some(a=>dig(a.oab)===dig(o.numero)))||nomes.some(n=>t.includes(n))}

  catch(e){h.className='hint bad';h.textContent=e&&e.message==='xlsx'?'Não foi possível carregar o leitor de planilhas. Verifique a conexão e tente de novo.':((e&&e.message)||'Não foi possível ler o arquivo.')}return}
 const txt=$('#f-texto').value.trim();if(!txt){toast('Escolha um arquivo ou cole o texto da publicação.');return}
 const j=ehMural(txt)?null:parseLoose(txt);const its=j&&(j.items||j.itens);let list;

 else if(Array.isArray(its))list=its.map(it=>normPub(it,''));
 else{if(!$('#f-disp').value){toast('Informe a data da publicação.');return}const m=txt.match(/\d{7}-?\d{2}\.?\d{4}\.?\d\.?\d{2}\.?\d{4}/);const num=m?cnjMask(m[0]):'';
  list=[{fonte:'manual',djenId:'',hash:'',numero:num,tribunal:$('#f-trib').value.trim()||cnjTribunal(num),orgao:'',classe:'',tipo:'Intimação',tipoDocumento:'',disponibilizacao:$('#f-disp').value,dataTipo:'disponibilizacao',texto:txt.slice(0,60000),link:'',destinatarios:[],advogados:[],oab:'',status:'nova'}]}
 const n=await salvarPubs(list);closeSheet();toast(n?`${n} publicação(ões) adicionada(s)`:'Essas publicações já estavam no sistema');S.pf='nova';location.hash='#publicacoes';schedule()}

function gsearch(q){q=q.trim().toLowerCase();const qd=dig(q);const out=[];if(q.length<2)return out;
 const has=(...v)=>v.join(' ').toLowerCase().includes(q)||(qd.length>=4&&v.some(x=>dig(x).includes(qd)));
 for(const p of S.processos)if(has(p.cliente,p.contraria,p.classe,p.numero,p.orgao))out.push(['Processo',`${p.cliente||p.classe||'Processo'}${p.numero?' · '+p.numero:''}`,'open-processo',p.id]);
 for(const p of S.prazos)if(has(p.descricao,p.obs))out.push(['Prazo',`${p.descricao} · ${fmtD(p.dataFatal)}`,'edit-prazo',p.id]);
 for(const t of S.tarefas)if(has(t.titulo,t.descricao))out.push(['Tarefa',t.titulo,'edit-tarefa',t.id]);
 for(const e of S.eventos)if(has(e.titulo,e.local))out.push(['Agenda',`${e.titulo||e.tipo} · ${fmtD(e.data)}`,'edit-evento',e.id]);
 for(const p of S.pubs)if(has(p.numero,p.orgao,p.tribunal,(p.destinatarios||[]).map(d=>d.nome).join(' ')))out.push(['Publicação',`${p.tipo||'Comunicação'} · ${p.numero||p.tribunal||''}`,'gs-pub',p.id,p.numero||'']);
 return out.slice(0,10)}
